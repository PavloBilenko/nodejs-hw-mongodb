tags:
  - Contacts
summary: Delete contact by id
operationId: deleteContact
description: Remove a specific contact by its ID.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
    example: '67ca67e7ae7f10c25b566655'
responses:
  '200':
    description: Successfully deleted the contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Contact successfully deleted'
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '400':
    $ref: ../../../components/responses/400.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
