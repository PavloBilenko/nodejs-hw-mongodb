get:
  tags:
    - Contacts
  summary: Get all contacts
  operationId: getAllContacts
  description: Retrieves a list of all contacts
  security:
    - bearerAuth: []
  parameters:
    - name: page
      in: query
      description: "Page number (default: 1)"
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    - name: perPage
      in: query
      description: "Number of items per page (default: 10)"
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

    - name: sortBy
      in: query
      description: "Field to sort by (e.g., `name`, `email`)"
      required: false
      schema:
        type: string

    - name: sortOrder
      in: query
      description: "Sorting order (`asc` or `desc`, default: `asc`)"
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: asc

    - name: isFavourite
      in: query
      description: "Filter by favourite status (`true` or `false`)"
      required: false
      schema:
        type: boolean

    - name: contactType
      in: query
      description: "Filter by contact type (`work`, `home`, `personal`)"
      required: false
      schema:
        type: string
        enum: [work, home, personal]

  responses:
    200:
      description: List of contacts
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: "Successfully found contacts!"
              data:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: "../../components/schemas.yaml#/Contact"
                  page:
                    type: integer
                    example: 1
                  perPage:
                    type: integer
                    example: 10
                  totalItems:
                    type: integer
                    example: 50
                  totalPages:
                    type: integer
                    example: 5
                  hasPreviousPage:
                    type: boolean
                    example: false
                  hasNextPage:
                    type: boolean
                    example: true
    401:
      description: Unauthorized - User authentication failed
    500:
      description: Internal Server Error - Something went wrong on the server
