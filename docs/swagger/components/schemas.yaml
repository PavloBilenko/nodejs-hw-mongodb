Contact:
  type: object
  properties:
    id:
      type: string
      example: "60d21b4667d0d8992e610c85"
    name:
      type: string
      example: "John Doe"
    phoneNumber:
      type: string
      example: "+123456789"
    email:
      type: string
      example: "john.doe@example.com"
    contactType:
      type: string
      enum: [work, home, personal]
      example: "work"
    isFavourite:
      type: boolean
      example: true
    userId:
      type: string
      example: "60d21b4567d0d8992e610c84"

ContactList:
  type: array
  items:
    $ref: "#/Contact"

ErrorResponse:
  type: object
  properties:
    status:
      type: integer
      example: 400
    message:
      type: string
      example: "Bad Request"
